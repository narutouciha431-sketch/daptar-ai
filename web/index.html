<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fb4">
<title>Дәптер AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/app.css?v=20">
</head>
<body>
<a class="skip" href="#view">Перейти к содержимому</a>
<header class="top">
  <a class="brand" href="/" title="На главную">
    <span class="logo" aria-hidden="true">Д</span>
    <div>
      <div class="brand-name" translate="no">Дәптер<span class="ai">AI</span></div>
      <div class="shop-name" id="shopName">Дүкен</div>
    </div>
  </a>
  <nav class="tabs" aria-label="Разделы">
    <a href="#kassa" data-page="kassa">Касса</a>
    <a href="#products" data-page="products">Товары</a>
    <a href="#customers" data-page="customers">Покупатели</a>
    <a href="#debts" data-page="debts">Долги</a>
    <a href="#cabinet" data-page="cabinet">Кабинет</a>
    <a href="#settings" data-page="settings">Настройки</a>
  </nav>
  <div class="user" data-lang-slot>
    <span class="live" id="live" title="Живая синхронизация экранов">● офлайн</span>
    <span class="user-name" id="userName"></span>
    <button type="button" class="ghost small" id="logout">Выйти</button>
  </div>
</header>

<main id="view"></main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/i18n.js?v=20"></script>
<script src="/static/kassa.js?v=20"></script>
<script src="/static/customers.js?v=20"></script>
<script src="/static/debts.js?v=20"></script>
<script src="/static/settings.js?v=20"></script>
<script src="/static/cabinet.js?v=20"></script>
<script src="/static/app.js?v=20"></script>
</body>
</html>
