# Настройки сервера Render: сайт берётся из GitHub и обновляется после каждого git push.
services:
  - type: web
    name: daptar-ai
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: TZ
        value: Asia/Almaty
      # Секреты вписываются вручную в панели Render (в GitHub их нет)
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: daptar_ai_bot
      - key: GEMINI_API_KEY
        sync: false
